## SampleRoadDetector
## The Clustering entry is gone on purpose: clustering confines an agent to its
## own K-means partition, which can never cover the whole map. The recursive
## sweep in SampleRoadDetector spreads the agents instead.
SampleRoadDetector.PathPlanning : sample_team.module.complex.AStarPathPlanning

