## DefaultTacticsPoliceForce
## FIXED: the value must be a fully qualified CLASS name. The original had a
## trailing ".java", so Class.forName failed, the custom clear was silently
## dropped and the police fell back to adf.impl.extaction.DefaultExtActionClear.
DefaultTacticsPoliceForce.RoadDetector : sample_team.module.complex.SampleRoadDetector
DefaultTacticsPoliceForce.Search : sample_team.module.complex.SampleSearch
DefaultTacticsPoliceForce.ExtActionClear : sample_team.module.complex.SampleExtActionClear
